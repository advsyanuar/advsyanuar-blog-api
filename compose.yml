services:
  portfolio_service:
    image: advsyanuar-portfolio-service
    container_name: portfolio-service
    ports:
      - "8085:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/main_service.db"
      Cors__AllowedOrigins: "http://localhost:5173,http://advsyanuar.cloud"
      DataProtection__KeyDirectory: "/app/data/dataprotection-keys"
    volumes:
      - ./data:/app/data
      - ./storage:/app/wwwroot/storage
    restart: unless-stopped